[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiritcuffs"
version = "0.2.0"
description = "A lightweight local tool that reviews your code with an LLM before every git push."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpiritCuffs contributors" }]
keywords = ["code-review", "llm", "git", "pre-push", "developer-tools"]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/wallycarvalho/spiritcuffs"
Repository = "https://github.com/wallycarvalho/spiritcuffs"
Issues = "https://github.com/wallycarvalho/spiritcuffs/issues"
Changelog = "https://github.com/wallycarvalho/spiritcuffs/blob/main/CHANGELOG.md"

[project.scripts]
spc = "spc.cli:app"
# Alias so `uvx spiritcuffs` / `pipx run spiritcuffs` work with the bare
# package name, matching the uvx/pipx launcher experience (bin name = package
# name, like `uvx <pypi-name>` for any tool).
spiritcuffs = "spc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["spc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry long JSON/HTTP-payload literals; wrapping them hurts clarity.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
